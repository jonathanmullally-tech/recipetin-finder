<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9b2c2c"><title>RecipeTin Finder</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"></head><body>
<header><div><h1>RecipeTin Finder</h1><p>Search the RecipeTin Eats website and your <em>Dinner</em> cookbook.</p></div><button id="syncBtn">Sync recipes</button></header>
<section id="status" class="status">Loading saved database…</section>
<main>
  <section class="filters">
    <input id="search" type="search" placeholder="Search recipes, ingredients, cuisine…">
    <select id="source"><option value="">All sources</option><option value="web">Website recipes</option><option value="cookbook">Dinner cookbook</option><option value="favorites">Favorites</option></select>
    <select id="protein"><option value="">Any protein</option><option>Chicken</option><option>Beef</option><option>Pork</option><option>Lamb</option><option>Fish</option><option>Salmon</option><option>Shrimp</option><option>Seafood</option><option>Vegetarian</option></select>
    <select id="ingredientCount"><option value="">Any ingredient count</option><option value="2">Exactly 2 ingredients</option><option value="3">Exactly 3 ingredients</option><option value="5">5 ingredients or fewer</option><option value="10">10 ingredients or fewer</option></select>
    <select id="prep"><option value="">Any prep time</option><option value="10">10 min or less prep</option><option value="20">20 min or less prep</option><option value="30">30 min or less prep</option></select>
    <select id="cook"><option value="">Any cook time</option><option value="10">10 min or less cook</option><option value="20">20 min or less cook</option><option value="30">30 min or less cook</option><option value="60">60 min or less cook</option></select>
    <select id="rating"><option value="">Any rating</option><option value="8">My rating 8+</option><option value="6">My rating 6+</option></select>
    <button id="randomBtn">🎲 Random from results</button><button id="shoppingBtn">🛒 Shopping list (<span id="selectedCount">0</span>)</button>
  </section>
  <div class="summary"><strong id="count">0</strong> recipes</div>
  <section id="cards" class="cards"></section>
</main>
<dialog id="detail"><button class="close" data-close>×</button><div id="detailBody"></div></dialog>
<dialog id="shopping"><button class="close" data-close>×</button><h2>Combined shopping list</h2><div id="shoppingBody"></div><div class="actions"><button id="shareShop">Share</button><button id="printShop">Print / Save PDF</button></div></dialog>
<script src="app.js"></script></body></html>
